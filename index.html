<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tidelight — a harbor that grows with you</title>
    <meta name="description" content="A local-first Three.js world. Every visitor donates a little light. The harbor gets bigger." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,620;9..144,700&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" crossorigin src="./assets/index-DPB8usB8.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Cq4vi2_U.css">
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>

      <div id="grade"></div>
      <div id="grain"></div>
      <div id="vignette"></div>
      <div id="arrive"></div>

      <div id="hud" class="hud">
        <header class="hud__top">
          <div class="brand">
            <span class="brand__mark"></span>
            <span>Tidelight</span>
          </div>
          <div class="hud__corner">
            <div id="players" class="players">
              <div id="compute-pill" class="pill">
                <span class="pill__dot"></span>
                <span id="peer-count">1</span>
                <span class="pill__label">in the harbor</span>
              </div>
              <div class="players__panel">
                <ul id="worker-list"></ul>
              </div>
            </div>
            <div id="compute-card" class="compute">
              <span id="compute-status">waking the harbor</span>
              <div class="meter"><i id="compute-meter"></i></div>
            </div>
          </div>
        </header>

        <div id="letter-toast" class="toast hidden"></div>
        <div id="prompt" class="prompt hidden"></div>
        <div id="hint" class="hint-toast hidden"></div>

        <div id="chat" class="chat">
          <ol id="chat-log"></ol>
          <form id="chat-form" autocomplete="off">
            <input id="chat-input" maxlength="140" placeholder="press enter to talk…" aria-label="chat" />
          </form>
        </div>

        <div class="hud__actions">
          <span id="fps" class="fps"></span>
          <button id="wave-btn" type="button" title="wave · G" aria-label="wave">👋</button>
          <button id="donate-btn" type="button" title="donate compute" aria-label="toggle compute" aria-pressed="true">⚡</button>
        </div>

        <div id="look-pad" class="look-pad hidden" aria-hidden="true"></div>
        <div id="touch" class="touch hidden">
          <div id="stick" class="stick" aria-label="move">
            <div class="stick__base"><div id="stick-knob" class="stick__knob"></div></div>
          </div>
          <div class="touch__actions">
            <button id="use-btn" type="button">use</button>
            <button id="jump-btn" type="button">jump</button>
            <button id="up-btn" type="button" class="hidden">up</button>
            <button id="down-btn" type="button" class="hidden">down</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
